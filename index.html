<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skyfall — pixel art</title>
<style>
  html,body{margin:0;height:100%;background:#04060a;overflow:hidden}
  body{display:grid;place-items:center;font:11px ui-monospace,monospace;color:#3a4a5c}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
  #hint{position:fixed;bottom:8px;left:0;right:0;text-align:center;letter-spacing:.12em;
        opacity:.55;pointer-events:none;text-transform:uppercase}
</style>
<canvas id="v"></canvas>
<div id="hint">click to replay</div>
<script>
const W = 200, H = 300;                       // internal pixel resolution
const view = document.getElementById('v'), vc = view.getContext('2d');
const off = document.createElement('canvas'); off.width = W; off.height = H;
const oc = off.getContext('2d');
const img = oc.createImageData(W, H), D = img.data;
for (let i = 3; i < D.length; i += 4) D[i] = 255;

function resize(){
  const s = Math.max(1, Math.min((innerWidth / W) | 0, ((innerHeight - 26) / H) | 0));
  view.width = W * s; view.height = H * s;
  vc.imageSmoothingEnabled = false;
}
addEventListener('resize', resize); resize();

/* ---------- pixel plotting ---------- */
function px(x, y, c){
  x |= 0; y |= 0; if (x < 0 || y < 0 || x >= W || y >= H) return;
  const i = (y * W + x) << 2;
  D[i] = c >> 16 & 255; D[i+1] = c >> 8 & 255; D[i+2] = c & 255;
}
function pxa(x, y, c, a){
  if (a <= 0) return; if (a >= 1) return px(x, y, c);
  x |= 0; y |= 0; if (x < 0 || y < 0 || x >= W || y >= H) return;
  const i = (y * W + x) << 2;
  D[i]   += ((c >> 16 & 255) - D[i])   * a;
  D[i+1] += ((c >>  8 & 255) - D[i+1]) * a;
  D[i+2] += ((c       & 255) - D[i+2]) * a;
}
function pxAdd(x, y, c, a){
  x |= 0; y |= 0; if (x < 0 || y < 0 || x >= W || y >= H) return;
  const i = (y * W + x) << 2;
  D[i]   = Math.min(255, D[i]   + (c >> 16 & 255) * a);
  D[i+1] = Math.min(255, D[i+1] + (c >>  8 & 255) * a);
  D[i+2] = Math.min(255, D[i+2] + (c       & 255) * a);
}
/* ordered dither — gives the gradients their chunky banded look */
const BAY = [0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5];
const bay = (x, y) => BAY[((y & 3) << 2) | (x & 3)] / 16;
function ditherRGB(r, g, b, x, y, step){
  const d = bay(x, y);
  const q = v => Math.min(255, Math.floor(v / step + d) * step);
  return (q(r) << 16) | (q(g) << 8) | q(b);
}
function lerpStops(stops, t){
  if (t <= stops[0].t) return stops[0].c;
  for (let i = 1; i < stops.length; i++){
    if (t <= stops[i].t){
      const a = stops[i-1], b = stops[i], f = (t - a.t) / (b.t - a.t);
      return [
        (a.c >> 16 & 255) + ((b.c >> 16 & 255) - (a.c >> 16 & 255)) * f,
        (a.c >>  8 & 255) + ((b.c >>  8 & 255) - (a.c >>  8 & 255)) * f,
        (a.c       & 255) + ((b.c       & 255) - (a.c       & 255)) * f];
    }
  }
  return stops[stops.length-1].c;
}
const asRGB = c => Array.isArray(c) ? c : [c >> 16 & 255, c >> 8 & 255, c & 255];

/* ---------- palettes ---------- */
const SKY = [
  { t: 0.00, c: 0x2a63b8 },
  { t: 0.40, c: 0x5aa2dc },
  { t: 0.74, c: 0x8fcdec },
  { t: 1.00, c: 0xcdeaf6 },
];
const WATER = [                                  // keyed on depth below surface
  { t:   0, c: 0x2f93ae },
  { t:  70, c: 0x1d6d90 },
  { t: 150, c: 0x11486c },
  { t: 260, c: 0x0a2f52 },
  { t: 380, c: 0x05192f },
  { t: 520, c: 0x010810 },
];
const DEEP = 0x01080f;
const FOAM = [0xffffff, 0xe2f6ff, 0xaddff2, 0x76c2e0];

function mixTo(c, target, f){
  const a = asRGB(c), b = asRGB(target);
  return (((a[0] + (b[0]-a[0])*f) | 0) << 16) |
         (((a[1] + (b[1]-a[1])*f) | 0) <<  8) |
          ((a[2] + (b[2]-a[2])*f) | 0);
}

/* ---------- rng (seeded so the scene is identical every replay) ---------- */
function mulberry(s){ return () => { s |= 0; s = s + 0x6D2B79F5 | 0;
  let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- sprites ---------- */
const PAL = { h: 0x3a2a1d, s: 0xe8b088, t: 0xc9484a, u: 0x8f2f36, p: 0x2d3a58, b: 0x1d1610 };
function sprite(rows){
  return { w: rows[0].length, h: rows.length, rows };
}
const POSE = {
  // the skydiver arch: small of the back is the lowest point, head + arm + heels
  // all lifted, face up. Drawn side-on with the head to the right.
  // face (skin) sits ON TOP of the hair — he's on his back, looking at the sky
  arch: sprite([
    '......ss.....',
    'bb....tt.....',
    '..p....t.....',
    '...p....t.sss',
    '....p...ttshh',
    '.....p..tu...',
    '......puu....',
  ]),
  // same arch, limbs fluttering a beat lower
  archB: sprite([
    '.............',
    '......ss.....',
    '.b.....t.....',
    '..p.....t.sss',
    '...pp...ttshh',
    '.....p..tu...',
    '......puu....',
  ]),
  // half-corrected: swinging upright, arm still trailing, legs straightening
  strand: sprite([
    '..hhh..',
    '..sss..',
    's.ttt..',
    '.sttts.',
    '..tut..',
    '..ttt..',
    '..ppp..',
    '..pp...',
    '..p.p..',
    '..p.p..',
    '..b.p..',
    '....b..',
  ]),
  // streamlined, feet-first — entry pose
  dive: sprite([
    '..hhh..',
    '..sss..',
    '.sttts.',
    '.sttts.',
    '.stuts.',
    '..ttt..',
    '..ppp..',
    '..ppp..',
    '..p.p..',
    '..p.p..',
    '..p.p..',
    '..b.b..',
  ]),
  // limp ragdoll, arms floating up above the head — sinking
  limp: sprite([
    's.......s',
    '.s.....s.',
    '..s...s..',
    '...hhh...',
    '..tssst..',
    '...tut...',
    '...ttt...',
    '...ppp...',
    '..pp.pp..',
    '..p...pp.',
    '..p....p.',
    '.bb....b.',
  ]),
};
/* nearest-neighbour rotation straight into the pixel buffer — stays chunky */
function drawSprite(sp, cx, cy, ang, fade, alpha){
  const c = Math.cos(-ang), s = Math.sin(-ang);
  const R = Math.ceil(Math.hypot(sp.w, sp.h) / 2) + 1;
  const hx = (sp.w - 1) / 2, hy = (sp.h - 1) / 2;
  for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++){
    const sx = Math.round(dx * c - dy * s + hx), sy = Math.round(dx * s + dy * c + hy);
    if (sx < 0 || sy < 0 || sx >= sp.w || sy >= sp.h) continue;
    const ch = sp.rows[sy][sx];
    if (ch === '.') continue;
    pxa(cx + dx, cy + dy, fade > 0 ? mixTo(PAL[ch], DEEP, fade) : PAL[ch], alpha === undefined ? 1 : alpha);
  }
}

/* ---------- scene state ---------- */
const SURFACE = 0;              // world y of the water surface
const START_Y = -1480;
let man, cam, t, rt, phase, impactT, impactRT, ended;
let clouds, specks, snow, rays, bubbles, drops, crowns, rings, foam;

function reset(){
  const R = mulberry(20260724);
  man = { x: W * 0.5 + 2, y: START_Y, vx: 4, vy: 30, ang: 0, spin: 0, pose: 'arch' };
  cam = { y: START_Y - H * 0.35 };
  t = 0; rt = 0; phase = 'fall'; impactT = 0; impactRT = 0; ended = false;
  bubbles = []; drops = []; crowns = []; rings = []; foam = [];

  clouds = [];
  for (let i = 0; i < 11; i++){
    const blobs = [], n = 3 + (R() * 4 | 0), sc = 0.55 + R() * 1.5;
    for (let j = 0; j < n; j++)
      blobs.push({ ox: (j - n / 2) * 7 * sc + R() * 4, oy: R() * 5 - 2, r: (4 + R() * 5) * sc });
    clouds.push({ x: R() * (W + 120) - 60, y: START_Y + 60 + i * 105 + R() * 40,
                  p: 0.55 + R() * 0.45, drift: (R() - 0.5) * 6, blobs });
  }
  specks = [];
  for (let i = 0; i < 90; i++) specks.push({ x: R() * W, y: START_Y + R() * 1500 });
  snow = [];
  for (let i = 0; i < 150; i++) snow.push({ x: R() * W, y: R() * 800, r: R() < 0.2 ? 1 : 0, ph: R() * 6.3 });
  rays = [];
  for (let i = 0; i < 5; i++)
    rays.push({ x: 20 + i * 42 + R() * 16, slope: 0.16 + R() * 0.2, w: 5 + R() * 7,
                i: 0.16 + R() * 0.14, ph: R() * 6.3 });
}

/* the wavy surface line, in world/screen x */
const waveAt = (x, tt) => Math.sin(x * 0.28 + tt * 1.9) * 1.9 + Math.sin(x * 0.11 - tt * 1.15) * 1.3;

/* ---------- update ---------- */
const G = 300, VMAX = 560;
function update(dt, rdt){
  t += dt; rt += rdt;

  if (phase === 'fall'){
    man.vy = Math.min(VMAX, man.vy + G * dt);
    man.y += man.vy * dt;
    man.x += man.vx * dt; man.vx *= 0.995;

    // hold the arch, then swing upright and correct into a feet-first entry
    if (t < 1.85){
      man.pose = (t * 3.2 | 0) % 2 ? 'arch' : 'archB';
      man.ang = Math.sin(t * 1.5) * 0.1;                  // lazy roll in the airflow
    } else if (t < 2.3){
      const f = (t - 1.85) / 0.45, e = f * f * (3 - 2 * f);
      man.pose = (t * 6 | 0) % 2 ? 'arch' : 'archB';
      man.ang = 0.1 * (1 - e) - 1.57 * e;                 // -90°: head swings up, heels drop
    } else if (t < 2.58){
      man.pose = 'strand';
      man.ang = -0.25 * (1 - (t - 2.3) / 0.28);
    } else {
      man.pose = 'dive';
      man.ang += (Math.sin(t * 3) * 0.05 - man.ang) * Math.min(1, 6 * dt);
    }
    if (man.y >= SURFACE) impact();
  } else {
    // underwater: heavy drag bleeds the entry speed off, then a slow settle
    man.vy += (45 - man.vy) * Math.min(1, 1.5 * dt);
    man.y += man.vy * dt;
    man.x += man.vx * dt; man.vx *= Math.pow(0.25, dt);
    man.spin *= Math.pow(0.5, dt);
    man.ang += man.spin * dt;
    man.ang += Math.sin(t * 0.7) * 0.25 * dt;
    man.pose = t - impactT < 0.5 ? 'dive' : 'limp';
    if (Math.random() < dt * 24 && man.y < 700)
      bubbles.push({ x: man.x + (Math.random() - 0.5) * 7, y: man.y + (Math.random() - 0.5) * 10,
                     r: Math.random() < 0.25 ? 1 : 0, vy: -14 - Math.random() * 22, ph: Math.random() * 6.3, a: 1 });
  }

  // camera lags behind so the splash stays framed for a beat.
  // driven by REAL dt, not slow-mo dt, or it never catches the sinking body.
  let want, k;
  if (phase === 'fall'){
    // as the sea gets close, ease the framing down so it rises into shot before he lands
    let n = Math.min(1, Math.max(0, 1 - (SURFACE - man.y) / 430));
    n = n * n * (3 - 2 * n);
    want = (man.y - H * 0.32) * (1 - n) + (SURFACE - H * 0.72) * n;
    k = 8;
  } else { want = man.y - H * 0.42; k = 1.1; }
  cam.y += (want - cam.y) * Math.min(1, k * rdt);
  if (man.y - cam.y > H * 0.66) cam.y = man.y - H * 0.66;   // never let him slip off frame

  for (const c of clouds) c.x += c.drift * dt;

  for (const b of bubbles){
    b.y += b.vy * dt; b.vy *= Math.pow(0.82, dt);
    b.vy = Math.min(b.vy, -9);
    b.x += Math.sin(t * 2.6 + b.ph) * 9 * dt;
    if (b.y <= SURFACE + waveAt(b.x, t)) b.a -= dt * 5;
  }
  bubbles = bubbles.filter(b => b.a > 0 && b.y > cam.y - 40);

  for (const d of drops){
    d.vy += 420 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.life -= dt;
    if (d.y > SURFACE && d.vy > 0 && !d.dead){ d.dead = true; ringAt(d.x, 6); }
  }
  drops = drops.filter(d => d.life > 0 && !d.dead);

  for (const c of crowns) c.p += dt / c.dur;
  crowns = crowns.filter(c => c.p < 1);
  for (const r of rings){ r.r += r.sp * dt; r.sp *= Math.pow(0.55, dt); r.life -= dt / r.dur; }
  rings = rings.filter(r => r.life > 0);
  for (const f of foam){ f.r += f.sp * dt; f.sp *= Math.pow(0.3, dt); f.life -= dt / f.dur; }
  foam = foam.filter(f => f.life > 0);

  if (phase !== 'fall' && rt - impactRT > 9.9) ended = true;
}
function ringAt(x, sp){ rings.push({ x, r: 1, sp, life: 1, dur: 1.1 }); }

function impact(){
  const ix = man.x;
  man.y = SURFACE; phase = 'water'; impactT = t; impactRT = rt;
  man.vy = VMAX * 0.9; man.spin = 0.5;
  crowns.push({ x: ix, p: 0, dur: 1.05, h: 40 });
  crowns.push({ x: ix - 5, p: -0.05, dur: 0.8, h: 22 });
  crowns.push({ x: ix + 5, p: -0.08, dur: 0.85, h: 25 });
  foam.push({ x: ix, r: 2, sp: 130, life: 1, dur: 1.0 });
  for (let i = 0; i < 4; i++) rings.push({ x: ix, r: 3 + i * 4, sp: 70 - i * 12, life: 1 + i * 0.15, dur: 1.4 });
  for (let i = 0; i < 90; i++){
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.5, sp = 60 + Math.random() * 230;
    drops.push({ x: ix + (Math.random() - 0.5) * 10, y: SURFACE - Math.random() * 3,
                 vx: Math.cos(a) * sp * 1.1, vy: Math.sin(a) * sp, life: 2.4, big: Math.random() < 0.2 });
  }
  for (let i = 0; i < 70; i++)
    bubbles.push({ x: ix + (Math.random() - 0.5) * 34, y: 4 + Math.random() * 120,
                   r: Math.random() < 0.3 ? 1 : 0, vy: -25 - Math.random() * 55, ph: Math.random() * 6.3, a: 1 });
}

/* ---------- render ---------- */
function render(){
  const surY = SURFACE - cam.y;                          // surface, in screen space

  // sky + sea body, row by row (dithered so it bands like real pixel art)
  const skyRow = [], watRow = [];
  for (let y = 0; y < H; y++){
    skyRow[y] = asRGB(lerpStops(SKY, y / (H - 1)));
    watRow[y] = asRGB(lerpStops(WATER, cam.y + y - SURFACE));
  }
  for (let x = 0; x < W; x++){
    const b = surY + waveAt(x, t);
    for (let y = 0; y < H; y++){
      const c = y < b ? skyRow[y] : watRow[y];
      const i = (y * W + x) << 2, q = ditherRGB(c[0], c[1], c[2], x, y, y < b ? 13 : 9);
      D[i] = q >> 16 & 255; D[i+1] = q >> 8 & 255; D[i+2] = q & 255;
    }
  }

  const airVisible = surY > 0;
  if (airVisible){
    // clouds (parallaxed against the camera)
    for (const c of clouds){
      const sy = H * 0.5 + (c.y - cam.y - H * 0.5) * c.p;
      if (sy < -40 || sy > surY + 30) continue;
      for (const bl of c.blobs){
        const bx = c.x + bl.ox, by = sy + bl.oy, r = bl.r;
        for (let dy = -r - 1; dy <= r + 1; dy++) for (let dx = -r - 1; dx <= r + 1; dx++){
          const d2 = (dx * dx) / 1.0 + (dy * dy) * 2.1;
          if (d2 > r * r) continue;
          const yy = by + dy; if (yy >= surY + waveAt(bx + dx, t)) continue;
          const edge = d2 / (r * r);
          const shade = dy > r * 0.25 ? 0xa9c6dd : (dy < -r * 0.2 ? 0xffffff : 0xe8f3fb);
          pxa(bx + dx, yy, shade, edge > 0.72 ? (bay(bx + dx, yy) < 0.55 ? 0.75 : 0) : 0.95);
        }
      }
    }
    // rushing air specks — sells the fall speed
    if (phase === 'fall'){
      const sp = Math.min(1, man.vy / VMAX), len = 1 + sp * 7;
      for (const s of specks){
        const sy = s.y - cam.y;
        if (sy < -20 || sy > Math.min(H, surY)) continue;
        for (let k = 0; k < len; k++) pxa(s.x, sy - k, 0xffffff, 0.22 * sp * sp * (1 - k / len));
      }
    }
  }

  const underCam = surY < H;                             // any water on screen
  if (underCam){
    // god rays from the surface
    for (const r of rays){
      for (let dep = 0; dep < 340; dep += 1){
        const sy = dep - cam.y + SURFACE;
        if (sy < 0) continue; if (sy >= H) break;
        const cx = r.x + dep * r.slope;
        const w = r.w * (1 + dep * 0.005);
        const amp = r.i * Math.pow(Math.max(0, 1 - dep / 340), 1.4) * (0.78 + 0.22 * Math.sin(t * 1.1 + r.ph));
        for (let dx = -w; dx <= w; dx++){
          const f = 1 - Math.abs(dx) / w;
          pxAdd(cx + dx, sy, 0x9fe4ff, amp * f * f * (bay(cx + dx, sy) < 0.7 ? 1 : 0.35));
        }
      }
    }
    // marine snow drifting in the beam
    for (const s of snow){
      const sy = s.y - cam.y + Math.sin(t * 0.6 + s.ph) * 3;
      if (sy < surY || sy < 0 || sy >= H) continue;
      const dep = cam.y + sy;
      const a = 0.32 * Math.max(0, 1 - dep / 460);
      pxa(s.x + Math.sin(t * 0.4 + s.ph) * 4, sy, 0xd8f2ff, a);
      if (s.r) pxa(s.x + Math.sin(t * 0.4 + s.ph) * 4, sy + 1, 0xd8f2ff, a * 0.6);
    }
  }

  // the man (tinted toward the deep as he sinks away)
  const mScreenY = man.y - cam.y;
  const fade = phase === 'fall' ? 0 : Math.min(0.95, Math.max(0, (man.y - 60) / 340));
  if (mScreenY > -20 && mScreenY < H + 20)
    drawSprite(POSE[man.pose], man.x, mScreenY, man.ang, fade);

  if (underCam){
    for (const b of bubbles){
      const sy = b.y - cam.y; if (sy < 0 || sy >= H) continue;
      const a = b.a * (0.55 + 0.45 * Math.min(1, (b.vy < -30 ? 1 : 0.7)));
      if (b.r){
        pxa(b.x, sy - 1, 0xcdefff, 0.75 * a); pxa(b.x - 1, sy, 0xa8dcf0, 0.6 * a);
        pxa(b.x + 1, sy, 0xa8dcf0, 0.6 * a); pxa(b.x, sy + 1, 0x8fcbe4, 0.5 * a);
      } else pxa(b.x, sy, 0xdff4ff, 0.7 * a);
    }
  }

  // surface, seen from above or below
  if (surY > -6 && surY < H + 6){
    for (let x = 0; x < W; x++){
      const y = surY + waveAt(x, t);
      const shim = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(x * 0.42 + t * 2.6));
      const spark = bay(x, y) < 0.6 ? 1 : 0.45;      // break the line up so it glitters
      pxa(x, y,     FOAM[0], (0.24 + 0.5 * shim) * spark);
      pxa(x, y - 1, FOAM[1], 0.16 * shim * spark);
      pxa(x, y + 1, FOAM[2], 0.30);
      pxa(x, y + 2, FOAM[3], 0.14);
    }
    // ripple crests travelling out from the entry point
    for (const r of rings) for (const dir of [-1, 1]){
      const cx = r.x + dir * r.r, h = 1 + 2.4 * r.life;
      for (let dx = -2; dx <= 2; dx++){
        const f = 1 - Math.abs(dx) / 3;
        const y = surY + waveAt(cx + dx, t) - h * f;
        pxa(cx + dx, y, FOAM[0], 0.8 * r.life * f);
        pxa(cx + dx, y + 1, FOAM[2], 0.5 * r.life * f);
      }
    }
    // expanding foam disc at the entry point
    for (const f of foam){
      for (let dx = -f.r; dx <= f.r; dx++){
        const e = Math.abs(dx) / f.r, y = surY + waveAt(f.x + dx, t);
        const a = f.life * (0.9 - e * 0.5) * (e > 0.65 ? 0.7 : 1);
        if (bay(f.x + dx, y) > a) continue;
        pxa(f.x + dx, y - 1, FOAM[1], 0.8); pxa(f.x + dx, y, FOAM[0], 0.95);
        pxa(f.x + dx, y + 1, FOAM[2], 0.7);
      }
    }
    // crown splash — rises, thins, collapses
    for (const c of crowns){
      if (c.p < 0) continue;
      const hh = c.h * Math.pow(Math.sin(c.p * Math.PI), 0.65);
      for (let k = 0; k < hh; k++){
        const f = k / Math.max(1, hh);
        const w = Math.max(0.5, (3.4 * Math.pow(1 - f, 0.55) + 2.2 * (1 - c.p)));
        const y = surY + waveAt(c.x, t) - k;
        for (let dx = -w; dx <= w; dx++){
          const e = Math.abs(dx) / (w + 0.001);
          if (bay(c.x + dx, y) > 1 - e * 0.75) continue;
          pxa(c.x + dx, y, e > 0.6 ? FOAM[2] : (f > 0.65 ? FOAM[1] : FOAM[0]), 0.95 - f * 0.25);
        }
      }
    }
  }

  // airborne droplets
  for (const d of drops){
    const sy = d.y - cam.y; if (sy < -4 || sy >= H) continue;
    const c = d.big ? FOAM[0] : FOAM[1];
    pxa(d.x, sy, c, 0.92);
    if (d.big){ pxa(d.x, sy - 1, FOAM[1], 0.6); pxa(d.x + 1, sy, FOAM[2], 0.5); }
    else if (d.vy > 90) pxa(d.x, sy - 1, FOAM[2], 0.35);
  }

  // underwater vignette + closing fade
  if (underCam){
    for (let y = Math.max(0, surY | 0); y < H; y++){
      const dep = cam.y + y, v = Math.min(0.62, Math.max(0, dep / 460));
      if (v <= 0.001) continue;
      for (let x = 0; x < W; x++){
        const e = Math.abs(x - W / 2) / (W / 2);
        pxa(x, y, DEEP, v * (0.35 + 0.65 * e * e));
      }
    }
  }
  const tail = phase !== 'fall' ? rt - impactRT : 0;
  if (tail > 7.5){
    const a = Math.min(1, (tail - 7.5) / 2.4);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) pxa(x, y, 0x000000, a);
  }

  oc.putImageData(img, 0, 0);
  vc.drawImage(off, 0, 0, view.width, view.height);
}

/* ---------- loop (slow-motion kicks in on impact) ---------- */
let last = performance.now();
function frame(now){
  const rdt = Math.min(0.05, (now - last) / 1000); last = now;
  let dt = rdt;
  if (phase !== 'fall'){
    const e = Math.min(1, (t - impactT) / 0.45);          // ease into slow-mo
    dt *= 1 - 0.76 * e;
  }
  update(dt, rdt);
  render();
  if (ended) reset();
  requestAnimationFrame(frame);
}
/* dev hook: #t=4.2 jumps the sim 4.2s in before the first paint */
function seek(secs){
  const step = 1 / 120;
  for (let s = 0; s < secs; s += step){
    let dt = step;
    if (phase !== 'fall') dt *= 1 - 0.76 * Math.min(1, (t - impactT) / 0.45);
    update(dt, step);
  }
}
addEventListener('pointerdown', reset);
addEventListener('keydown', e => { if (e.code === 'Space') reset(); });
reset();
const m = /t=([\d.]+)/.exec(location.hash);
if (m){ seek(+m[1]);
  document.getElementById('hint').textContent =
    `t=${t.toFixed(2)} pose=${man.pose} ang=${man.ang.toFixed(2)} y=${man.y.toFixed(0)} ph=${phase}`; }
requestAnimationFrame(frame);
</script>
